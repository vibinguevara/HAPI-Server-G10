<!DOCTYPE html>
<html lang="en">

	<div th:fragment="banner" class="card welcome-card mb-4" >
		<script>
			// Function to check if a file exists using AJAX
			function fileExists(filePath, callback) {
				var xhr = new XMLHttpRequest();
				xhr.onreadystatechange = function() {
					if (xhr.readyState === 4) {
						callback(xhr.status === 200);
					}
				};
				xhr.open("HEAD", filePath, true);
				xhr.send();
			}

			// Replace content if static/welcome.html exists
			fileExists("content/custom/welcome.html", function(exists) {
				if (exists) {
					loadFile("content/custom/welcome.html", function(content) {
						var replacementContainer = document.getElementById("replacementWelcome");
						replacementContainer.innerHTML = content;
					});
				}
			});

			// Function to load file content using AJAX
			function loadFile(filePath, callback) {
				var xhr = new XMLHttpRequest();
				xhr.onreadystatechange = function() {
					if (xhr.readyState === 4 && xhr.status === 200) {
						callback(xhr.responseText);
					}
				};
				xhr.open("GET", filePath, true);
				xhr.send();
			}
		</script>
		<div class="card-body">
			<div id="replacementWelcome">
				<h4 class="welcome-heading">Welcome to the FHIR Server</h4>
				<p class="welcome-text">
					This instance delivers a standards-compliant implementation of the HL7&reg; FHIR&reg; Specification
					built on top of enterprise-grade clinical interoperability components.
				</p>
				<p class="welcome-subtext mb-0">
					Powered by the proven open-source <a href="https://github.com/hapifhir/hapi-fhir/" target="_blank" rel="noopener noreferrer">HAPI FHIR</a> engine (Apache 2.0 Licensed).
				</p>
			</div>
		</div>
	</div>

</html>
